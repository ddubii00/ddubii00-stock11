name: stock11

services:
  app:
    build:
      context: .
      target: app
      args:
        STOCK11_BASE_PATH: /stock11-7
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${STOCK11_PORT:-3011}:3000"
    volumes:
      - stock11-profile:/app/data
    environment:
      STOCK11_DATA_PROVIDER: kis
      KIS_RELAY_URL: http://kis-relay:8091
      STOCK11_PROFILE_STORE: sqlite
      STOCK11_SQLITE_PATH: /app/data/stock11-profile.sqlite
      STOCK11_SYNC_ENABLED: ${STOCK11_SYNC_ENABLED:-true}
      STOCK11_SYNC_PASSWORD: ${STOCK11_SYNC_PASSWORD:-}
      STOCK11_SYNC_ORIGIN: ${STOCK11_SYNC_ORIGIN:-}
      STOCK11_USER_ID: ${STOCK11_USER_ID:-personal}
      STOCK11_REDIS_PREFIX: ${STOCK11_REDIS_PREFIX:-stock11}
    depends_on:
      kis-relay:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  kis-relay:
    build:
      context: .
      target: kis-relay
    init: true
    restart: unless-stopped
    environment:
      KIS_APP_KEY: ${KIS_APP_KEY:?Set KIS_APP_KEY in .env.oracle}
      KIS_APP_SECRET: ${KIS_APP_SECRET:?Set KIS_APP_SECRET in .env.oracle}
      KIS_MAX_SUBSCRIPTIONS: ${KIS_MAX_SUBSCRIPTIONS:-40}
      KIS_REST_MIN_INTERVAL_MS: ${KIS_REST_MIN_INTERVAL_MS:-350}
      KIS_REST_MAX_CONCURRENCY: ${KIS_REST_MAX_CONCURRENCY:-2}
      KIS_RELAY_HOST: 0.0.0.0
      KIS_RELAY_PORT: 8091
    # No published port: only the app container can reach this service.
    read_only: true
    security_opt:
      - no-new-privileges:true

volumes:
  stock11-profile:
